            <form>
                <div class="mb-3">

                    </select>
                </div>
                <div class="mb-3">
                    <label for="organe" class="form-label">Choisissez l'organe affecté :</label>
                    <select id="organe" class="form-select">
                        <option value="grain">Grain</option>
                        <option value="epi">Épi</option>
                        <option value="tige">Tige</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Diagnostiquer</button>
