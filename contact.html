<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Contact</title>
    
    <!-- Lien vers le fichier CSS commun -->
    <link rel="stylesheet" href="Plante.css">
    
    <!-- Lien vers Bootstrap CSS si nécessaire -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="Plante.html">NotreSite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="qui-nous-sommes.html">Qui Sommes Nous</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="questionnaire.html">Questionnaire</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="contact" class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Contact</h2>
        <p class="text-center">Vous avez des questions ou besoin d'assistance ? N'hésitez pas à nous contacter via le formulaire ci-dessous.</p>
        <form id="contactForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nom" class="form-label">Nom</label>
                    <input type="text" id="nom" class="form-control" placeholder="Votre nom" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Votre email" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="5" placeholder="Votre message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary d-block mx-auto">Envoyer</button>
        </form>
        <div id="formMessage" class="mt-3"></div> <!-- Message de confirmation -->
        
    </section>
    
    <footer class="py-3 text-center">
        <p>&copy; 2024 Diagnostic des Maladies des Céréales. Tous droits réservés.</p>
    </footer>
 <!-- Lien vers le fichier JavaScript commun -->
